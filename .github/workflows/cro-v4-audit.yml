name: CRO V4 release audit
on:
  push:
    branches: [cro/perfect-message-2026-08-17]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production tests
        run: npm test
      - name: Verify final conversion message
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Kostenlose Strategieanalyse starten' dist/index.html
          grep -q 'Dein klarer Weg' dist/index.html
          grep -q 'Das Ergebnis' dist/index.html
          grep -q 'Ausgangslage &amp; Ziel klären' dist/index.html
          grep -q 'Strategie &amp; Risikorahmen bauen' dist/index.html
          grep -q 'Prozess &amp; Routine umsetzen' dist/index.html
          grep -q 'Was du im Prozess <em>konkret aufbaust.</em>' dist/index.html
          if grep -q 'Cashflow-Check' dist/index.html; then echo 'vague Cashflow-Check copy remains'; exit 1; fi
          if grep -q 'Persönlicher Cashflow-Plan' dist/index.html; then echo 'stale hero clutter remains'; exit 1; fi
